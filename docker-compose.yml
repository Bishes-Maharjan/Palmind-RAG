version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: palmmind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: palmmind_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: palmmind_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: palmmind_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ragdb
      REDIS_URL: redis://redis:6379/0
      REDIS_CHAT_TTL_SECONDS: 86400
      REDIS_MAX_TURNS: 10
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: document_chunks
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock-key-for-local}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      MAX_UPLOAD_SIZE_BYTES: 10485760
      RAG_TOP_K: 4
      RAG_SCORE_THRESHOLD: 0.3
      FIXED_CHUNK_SIZE: 500
      FIXED_CHUNK_OVERLAP: 100
      SEMANTIC_SIMILARITY_THRESHOLD: 0.75
      SEMANTIC_MIN_CHUNK_SIZE: 100
      SEMANTIC_MAX_CHUNK_SIZE: 1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
